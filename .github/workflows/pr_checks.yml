name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MIX_ENV: test
  STRAVA_CLIENT_ID: pr-checks-dummy-client-id
  STRAVA_CLIENT_SECRET: pr-checks-dummy-client-secret

jobs:
  precommit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.19.5"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run precommit checks
        run: mix precommit

      # mix precommit's `format` and `deps.unlock --unused` steps auto-fix
      # rather than fail on violations, so a bad-formatting PR would
      # otherwise sail through silently fixed. Fail if precommit touched
      # anything the PR didn't already commit.
      - name: Verify precommit made no changes
        run: git diff --exit-code
